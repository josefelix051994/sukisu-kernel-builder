# ============================================================================
# SukiSU-Ultra 内核编译工具 - 设备库
# 字段 (用 | 分隔, 共 9 列):
#   1. 设备ID         : 唯一标识 (同时也是 codename, 用于自动探测 defconfig)
#   2. 版本标签       : 该内核版本在菜单里显示的文字
#   3. 设备显示名     : 型号菜单里显示的名字
#   4. 内核仓库 URL   : git 可克隆的地址
#   5. 分支名         : 仓库分支 (对应某一 Android/内核版本)
#   6. 内核版本提示   : 仅用于显示和选择编译器 (克隆后以源码实际版本为准)
#   7. Android 版本   : 用于选择 Clang 版本
#   8. GKI 标志       : 1=GKI 通用内核 (默认 LKM 模式), 0=非 GKI (默认内置)
#   9. defconfig 提示 : arch/arm64/configs/ 下的路径 (可为 glob, 可留空自动探测)
#
# 所有条目已于 2026-11-20 通过 GitHub API 逐条核实存在。
# 自行添加条目: 按上述格式追加一行即可; 分支名请到对应仓库确认。
# ============================================================================

