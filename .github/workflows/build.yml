name: SukiSU Kernel Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备 ID(如 alioth、op8、gki-a15;自定义源时填 custom)'
        required: true
        default: ''
      version:
        description: '版本序号(该设备的第几个版本, 从 1 开始)'
        required: false
        default: '1'
      ksu_branch:
        description: 'SukiSU 集成分支(留空=自动: GKI 用 main, 传统内核用 builtin)'
        required: false
        type: choice
        options: ['', main, builtin]
        default: ''
      ksu_mode:
        description: 'CONFIG_KSU 模式: 留空=自动(GKI 用 m, 非 GKI 用 y)'
        required: false
        type: choice
        options: ['', 'y', 'm']
        default: ''
      kpm:
        description: '启用 KPM(内核补丁模块)'
        required: false
        type: boolean
        default: false
      debug_ksu:
        description: '启用 KSU_DEBUG'
        required: false
        type: boolean
        default: false
      susfs:
        description: '启用 SUSFS(要求内核已集成 susfs4ksu 补丁, 否则编译失败)'
        required: false
        type: boolean
        default: false
      jobs:
        description: '并行编译数(留空=自动, 公共 runner 只有 2 核, 建议留空)'
        required: false
        default: ''
      clean:
        description: '编译前清空 work/ 目录(每次全新构建; 公共 runner 本身不保留旧数据, 一般无需勾选)'
        required: false
        type: boolean
        default: false
      custom_repo:
        description: '[自定义源] 内核仓库 URL'
        required: false
        default: ''
      custom_branch:
        description: '[自定义源] 仓库分支'
        required: false
        default: ''
      custom_defconfig:
        description: '[自定义源] defconfig(留空=自动探测)'
        required: false
        default: ''
      custom_kver:
        description: '[自定义源] 内核主版本提示, 如 5.15(用于选编译器)'
        required: false
        default: ''
      custom_android:
        description: '[自定义源] Android 版本号, 如 13(用于选 Clang)'
        required: false
        default: ''
      custom_gki:
        description: '[自定义源] 是否为 GKI 内核'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '演练模式: 只打印任务不编译(调试用)'
        required: false
        type: boolean
        default: false
      publish:
        description: '编译成功后自动发布到 GitHub Release(附带设备/内核/版本等说明)'
        required: false
        type: boolean
        default: true
  # 可被其它工作流(如 build-all.yml 全量矩阵)复用调用
  workflow_call:
    inputs:
      device:
        required: true
        type: string
        default: ''
      version:
        required: false
        type: string
        default: '1'
      ksu_branch:
        required: false
        type: string
        default: ''
      ksu_mode:
        required: false
        type: string
        default: ''
      kpm:
        required: false
        type: boolean
        default: false
      debug_ksu:
        required: false
        type: boolean
        default: false
      susfs:
        required: false
        type: boolean
        default: false
      jobs:
        required: false
        type: string
        default: ''
      clean:
        required: false
        type: boolean
        default: false
      custom_repo:
        required: false
        type: string
        default: ''
      custom_branch:
        required: false
        type: string
        default: ''
      custom_defconfig:
        required: false
        type: string
        default: ''
      custom_kver:
        required: false
        type: string
        default: ''
      custom_android:
        required: false
        type: string
        default: ''
      custom_gki:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false
      publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 计算工具链缓存标识(同 clang/gcc 组合共享, 避免全量编译重复占缓存配额)
        id: tc
        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
          CUSTOM_ANDROID: ${{ inputs.custom_android }}
          CUSTOM_KVER: ${{ inputs.custom_kver }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > tc-key.txt
          import json, os
          dev = (os.environ.get('DEVICE') or '').strip()
          ver = (os.environ.get('VERSION') or '1').strip() or '1'
          android = (os.environ.get('CUSTOM_ANDROID') or '').strip()
          kver = (os.environ.get('CUSTOM_KVER') or '').strip()
          try:
              raw = open('devices.json', 'rb').read()
              if raw[:2] == b'\xff\xfe':
                  text = raw.decode('utf-16-le').lstrip('\ufeff')
              elif raw[:3] == b'\xef\xbb\xbf':
                  text = raw.decode('utf-8-sig')
              else:
                  text = raw.decode('utf-8')
              for d in json.loads(text).get('devices', []):
                  if d.get('id') == dev:
                      idx = int(ver) - 1
                      vers = d.get('versions') or []
                      if 0 <= idx < len(vers):
                          v = vers[idx]
                          android = str(v.get('android') or '') or android
                          kver = str(v.get('kver') or '') or kver
                      break
          except Exception:
              pass
          try:
              a = int(float(android))
          except Exception:
              a = 0
          spec = {
              9: 'llvm-r365631', 10: 'llvm-r416183',
              11: 'llvm-r450784', 12: 'llvm-r450784',
              13: 'llvm-r487747', 14: 'llvm-r510928',
              15: 'llvm-r522817', 16: 'llvm-r522817', 17: 'llvm-r522817',
          }.get(a, 'llvm-r365631')
          gcc = 'clang+gcc49'
          try:
              parts = [int(x) for x in kver.split('.')[:2]]
              if len(parts) >= 2 and (parts[0], parts[1]) < (4, 14):
                  gcc = 'gcc49-only'
          except Exception:
              gcc = 'unknown'
          print(f"{spec}-{gcc}")
          PY
          echo "key=$(cat tc-key.txt)" >> "$GITHUB_OUTPUT"
          echo "工具链缓存标识: $(cat tc-key.txt)"

      - name: 恢复编译工具链缓存(Clang/GCC, 命中可省去重新下载解压)
        uses: actions/cache@v4
        with:
          path: work/toolchains
          key: toolchains-${{ steps.tc.outputs.key }}-v2
          restore-keys: |
            toolchains-

      - name: 恢复 ccache 编译缓存(重复编译同一设备/版本可大幅提速)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.device }}-${{ inputs.version }}-${{ inputs.ksu_branch }}-${{ inputs.custom_repo }}-v1
          restore-keys: |
            ccache-${{ inputs.device }}-
            ccache-

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl make gcc g++ bc bison flex python3 zip cpio ccache \
            libssl-dev xz-utils lz4 zstd dwarves libdw-dev libelf-dev || true
          # 老内核 GCC 4.9 预编译可能需要 libtinfo5(新版本 Ubuntu 已移除, 装不上就忽略)
          sudo apt-get install -y --no-install-recommends libtinfo5 || true
          sudo apt-get install -y --no-install-recommends libncurses-dev || true
          echo "=== 依赖就绪 ==="

      - name: 组装编译参数并启动构建
        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
          KSU_MODE: ${{ inputs.ksu_mode }}
          KPM: ${{ inputs.kpm }}
          DEBUG_KSU: ${{ inputs.debug_ksu }}
          SUSFS: ${{ inputs.susfs }}
          JOBS: ${{ inputs.jobs }}
          CLEAN: ${{ inputs.clean }}
          CUSTOM_REPO: ${{ inputs.custom_repo }}
          CUSTOM_BRANCH: ${{ inputs.custom_branch }}
          CUSTOM_DEFCONFIG: ${{ inputs.custom_defconfig }}
          CUSTOM_KVER: ${{ inputs.custom_kver }}
          CUSTOM_ANDROID: ${{ inputs.custom_android }}
          CUSTOM_GKI: ${{ inputs.custom_gki }}
          DRY_RUN: ${{ inputs.dry_run }}
          # ccache: 复用编译产物缓存, 同一设备/版本重复编译可大幅提速
          KERNEL_CCACHE: '1'
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$CUSTOM_REPO" ]; then
            ARGS+=(--repo "$CUSTOM_REPO" --branch "$CUSTOM_BRANCH")
            [ -n "$CUSTOM_DEFCONFIG" ] && ARGS+=(--defconfig "$CUSTOM_DEFCONFIG")
            [ -n "$CUSTOM_KVER" ] && ARGS+=(--kver "$CUSTOM_KVER")
            [ -n "$CUSTOM_ANDROID" ] && ARGS+=(--android "$CUSTOM_ANDROID")
            [ "$CUSTOM_GKI" = "true" ] && ARGS+=(--gki)
          else
            ARGS+=(--device "$DEVICE" --version "${VERSION:-1}")
          fi
          [ -n "$KSU_BRANCH" ] && ARGS+=(--ksu "$KSU_BRANCH")
          [ -n "$KSU_MODE" ] && ARGS+=(--ksu-mode "$KSU_MODE")
          [ "$KPM" = "true" ] && ARGS+=(--kpm)
          [ "$DEBUG_KSU" = "true" ] && ARGS+=(--debug-ksu)
          [ "$SUSFS" = "true" ] && ARGS+=(--susfs)
          [ -n "$JOBS" ] && ARGS+=(--jobs "$JOBS")
          [ "$CLEAN" = "true" ] && ARGS+=(--clean)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          ARGS+=(--yes)
          echo ">>> 执行: bash build.sh ${ARGS[*]}"
          bash build.sh "${ARGS[@]}"

      - name: 产物清单
        run: |
          echo "=== output/ 目录 ==="
          ls -lh output/ || echo "(无产物, 可能为 dry-run 或编译失败)"
          echo "=== 完成 ==="

      - name: ccache 命中统计
        if: always()
        run: |
          ccache --show-stats || echo "(ccache 不可用)"
          echo "缓存目录: $(du -sh /home/runner/.ccache 2>/dev/null | cut -f1 || echo 0)"

      - name: 上传调试日志(失败时排查用)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ inputs.device }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 读取产物名称
        id: art
        if: always()
        run: |
          if [ -f output/LAST_ARTIFACT ]; then
            b="$(basename "$(cat output/LAST_ARTIFACT)")"
            echo "name=${b%.*}" >> "$GITHUB_OUTPUT"
            echo "file=$(cat output/LAST_ARTIFACT)" >> "$GITHUB_OUTPUT"
          else
            echo "name=kernel-${{ inputs.device }}" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传产物
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布到统一 Release(中文机型名资产)
        if: success() && !inputs.dry_run && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: 内核合集
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          art="${{ steps.art.outputs.file }}"
          if [ -z "$art" ] || [ ! -f "$art" ]; then echo "无产物文件, 跳过发布"; exit 0; fi
          asset="$(cat output/RELEASE_ASSET 2>/dev/null || true)"
          [ -n "$asset" ] || asset="$(basename "$art")"
          echo ">>> 发布产物到统一 Release: tag=${RELEASE_TAG} asset=${asset}"

          # 统一 Release: 不存在则创建 (并发创建时忽略"已存在"报错)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            cat > /tmp/aggregate-notes.md <<'NOTES'
          ## SukiSU-Ultra 内核合集

          本 Release 收录全部机型的内核刷机包, 资产名统一为 **中文机型名_机型代码_内核版本.zip**,
          可直接按机型中文名查找; 各机型对应的内核版本 / 分支 / 刷入说明见本仓库 README 的「内核下载索引」。

          - 刷入方式: TWRP 等支持 AnyKernel3 的 Recovery 直刷 (非 GKI 4.x/5.x 机型), 刷前请备份 boot 分区;
          - 由 [SukiSU-Ultra 内核编译工具](https://github.com/xingyiqaq/sukisu-kernel-builder) 自动构建, 仅供个人学习研究。
          NOTES
            gh release create "$RELEASE_TAG" --title "SukiSU-Ultra 内核合集(按中文机型名索引)" \
              --notes-file /tmp/aggregate-notes.md 2>/dev/null || true
          fi

          # 注意: gh release upload 会把资产名里的非 ASCII 字符去掉 (红米8_x.zip → 8_x.zip),
          # 所以这里直接用 REST API 上传, 用 name= 参数显式传 URL 编码后的中文名。
          release_id="$(gh api "repos/${REPO}/releases/tags/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$RELEASE_TAG")" --jq .id)"
          qname="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe=""))' "$asset")"
          # 同名资产先删除 (等价 --clobber), 保证链接长期有效
          gh api "repos/${REPO}/releases/${release_id}/assets?per_page=100" --jq '.[] | select(.name=="'"$asset"'") | .id' 2>/dev/null | while read -r old_id; do
            [ -n "$old_id" ] && gh api -X DELETE "repos/${REPO}/releases/assets/${old_id}" >/dev/null
          done
          code="$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@${art}" \
            "https://uploads.github.com/repos/${REPO}/releases/${release_id}/assets?name=${qname}")"
          if [ "$code" != "201" ]; then echo "上传失败 (HTTP ${code}): $(cat /tmp/upload.json)"; exit 1; fi
          echo ">>> 已上传资产: $(python3 -c 'import json,sys;print(json.load(open("/tmp/upload.json"))["name"])')"
          echo ">>> 下载直链: https://github.com/${REPO}/releases/download/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1], safe=""))' "$RELEASE_TAG")/${qname}"
          echo ">>> 下载直链: https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${asset}"
