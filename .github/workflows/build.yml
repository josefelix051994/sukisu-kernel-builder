name: SukiSU Kernel Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: '璁惧 ID(濡?alioth銆乷p8銆乬ki-a15;鑷畾涔夋簮鏃跺～ custom)'
        required: true
        default: ''
      version:
        description: '鐗堟湰搴忓彿(璇ヨ澶囩殑绗嚑涓増鏈? 浠?1 寮€濮?'
        required: false
        default: '1'
      ksu_branch:
        description: 'SukiSU 闆嗘垚鍒嗘敮(鐣欑┖=鑷姩: GKI 鐢?main, 浼犵粺鍐呮牳鐢?builtin)'
        required: false
        type: choice
        options: ['', main, builtin]
        default: ''
      ksu_mode:
        description: 'CONFIG_KSU 妯″紡: 鐣欑┖=鑷姩(GKI 鐢?m, 闈?GKI 鐢?y)'
        required: false
        type: choice
        options: ['', 'y', 'm']
        default: ''
      kpm:
        description: '鍚敤 KPM(鍐呮牳琛ヤ竵妯″潡)'
        required: false
        type: boolean
        default: false
      debug_ksu:
        description: '鍚敤 KSU_DEBUG'
        required: false
        type: boolean
        default: false
      susfs:
        description: '鍚敤 SUSFS(瑕佹眰鍐呮牳宸查泦鎴?susfs4ksu 琛ヤ竵, 鍚﹀垯缂栬瘧澶辫触)'
        required: false
        type: boolean
        default: false
      jobs:
        description: '骞惰缂栬瘧鏁?鐣欑┖=鑷姩, 鍏叡 runner 鍙湁 2 鏍? 寤鸿鐣欑┖)'
        required: false
        default: ''
      clean:
        description: '缂栬瘧鍓嶆竻绌?work/ 鐩綍(姣忔鍏ㄦ柊鏋勫缓; 鍏叡 runner 鏈韩涓嶄繚鐣欐棫鏁版嵁, 涓€鑸棤闇€鍕鹃€?'
        required: false
        type: boolean
        default: false
      custom_repo:
        description: '[鑷畾涔夋簮] 鍐呮牳浠撳簱 URL'
        required: false
        default: ''
      custom_branch:
        description: '[鑷畾涔夋簮] 浠撳簱鍒嗘敮'
        required: false
        default: ''
      custom_defconfig:
        description: '[鑷畾涔夋簮] defconfig(鐣欑┖=鑷姩鎺㈡祴)'
        required: false
        default: ''
      custom_kver:
        description: '[鑷畾涔夋簮] 鍐呮牳涓荤増鏈彁绀? 濡?5.15(鐢ㄤ簬閫夌紪璇戝櫒)'
        required: false
        default: ''
      custom_android:
        description: '[鑷畾涔夋簮] Android 鐗堟湰鍙? 濡?13(鐢ㄤ簬閫?Clang)'
        required: false
        default: ''
      custom_gki:
        description: '[鑷畾涔夋簮] 鏄惁涓?GKI 鍐呮牳'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '婕旂粌妯″紡: 鍙墦鍗颁换鍔′笉缂栬瘧(璋冭瘯鐢?'
        required: false
        type: boolean
        default: false
      publish:
        description: '缂栬瘧鎴愬姛鍚庤嚜鍔ㄥ彂甯冨埌 GitHub Release(闄勫甫璁惧/鍐呮牳/鐗堟湰绛夎鏄?'
        required: false
        type: boolean
        default: true
  # 鍙鍏跺畠宸ヤ綔娴?濡?build-all.yml 鍏ㄩ噺鐭╅樀)澶嶇敤璋冪敤
  workflow_call:
    inputs:
      device:
        required: true
        type: string
        default: ''
      version:
        required: false
        type: string
        default: '1'
      ksu_branch:
        required: false
        type: string
        default: ''
      ksu_mode:
        required: false
        type: string
        default: ''
      kpm:
        required: false
        type: boolean
        default: false
      debug_ksu:
        required: false
        type: boolean
        default: false
      susfs:
        required: false
        type: boolean
        default: false
      jobs:
        required: false
        type: string
        default: ''
      clean:
        required: false
        type: boolean
        default: false
      custom_repo:
        required: false
        type: string
        default: ''
      custom_branch:
        required: false
        type: string
        default: ''
      custom_defconfig:
        required: false
        type: string
        default: ''
      custom_kver:
        required: false
        type: string
        default: ''
      custom_android:
        required: false
        type: string
        default: ''
      custom_gki:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false
      publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 妫€鍑轰粨搴?        uses: actions/checkout@v4

      - name: 璁＄畻宸ュ叿閾剧紦瀛樻爣璇?鍚?clang/gcc 缁勫悎鍏变韩, 閬垮厤鍏ㄩ噺缂栬瘧閲嶅鍗犵紦瀛橀厤棰?
        id: tc
        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
          CUSTOM_ANDROID: ${{ inputs.custom_android }}
          CUSTOM_KVER: ${{ inputs.custom_kver }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > tc-key.txt
          import json, os
          dev = (os.environ.get('DEVICE') or '').strip()
          ver = (os.environ.get('VERSION') or '1').strip() or '1'
          android = (os.environ.get('CUSTOM_ANDROID') or '').strip()
          kver = (os.environ.get('CUSTOM_KVER') or '').strip()
          try:
              raw = open('devices.json', 'rb').read()
              if raw[:2] == b'\xff\xfe':
                  text = raw.decode('utf-16-le').lstrip('\ufeff')
              elif raw[:3] == b'\xef\xbb\xbf':
                  text = raw.decode('utf-8-sig')
              else:
                  text = raw.decode('utf-8')
              for d in json.loads(text).get('devices', []):
                  if d.get('id') == dev:
                      idx = int(ver) - 1
                      vers = d.get('versions') or []
                      if 0 <= idx < len(vers):
                          v = vers[idx]
                          android = str(v.get('android') or '') or android
                          kver = str(v.get('kver') or '') or kver
                      break
          except Exception:
              pass
          try:
              a = int(float(android))
          except Exception:
              a = 0
          spec = {
              9: 'llvm-r365631', 10: 'llvm-r416183',
              11: 'llvm-r450784', 12: 'llvm-r450784',
              13: 'llvm-r487747', 14: 'llvm-r510928',
              15: 'llvm-r522817', 16: 'llvm-r522817', 17: 'llvm-r522817',
          }.get(a, 'llvm-r365631')
          gcc = 'clang+gcc49'
          try:
              parts = [int(x) for x in kver.split('.')[:2]]
              if len(parts) >= 2 and (parts[0], parts[1]) < (4, 14):
                  gcc = 'gcc49-only'
          except Exception:
              gcc = 'unknown'
          print(f"{spec}-{gcc}")
          PY
          echo "key=$(cat tc-key.txt)" >> "$GITHUB_OUTPUT"
          echo "宸ュ叿閾剧紦瀛樻爣璇? $(cat tc-key.txt)"

      - name: 鎭㈠缂栬瘧宸ュ叿閾剧紦瀛?Clang/GCC, 鍛戒腑鍙渷鍘婚噸鏂颁笅杞借В鍘?
        uses: actions/cache@v4
        with:
          path: work/toolchains
          key: toolchains-${{ steps.tc.outputs.key }}-v2
          restore-keys: |
            toolchains-

      - name: 鎭㈠ ccache 缂栬瘧缂撳瓨(閲嶅缂栬瘧鍚屼竴璁惧/鐗堟湰鍙ぇ骞呮彁閫?
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.device }}-${{ inputs.version }}-${{ inputs.ksu_branch }}-${{ inputs.custom_repo }}-v1
          restore-keys: |
            ccache-${{ inputs.device }}-
            ccache-

      - name: 瀹夎缂栬瘧渚濊禆
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl make gcc g++ bc bison flex python3 zip cpio ccache \
            libssl-dev xz-utils lz4 zstd dwarves libelf-dev || true
          # 鑰佸唴鏍?GCC 4.9 棰勭紪璇戝彲鑳介渶瑕?libtinfo5(鏂扮増鏈?Ubuntu 宸茬Щ闄? 瑁呬笉涓婂氨蹇界暐)
          sudo apt-get install -y --no-install-recommends libtinfo5 || true
          sudo apt-get install -y --no-install-recommends libncurses-dev || true
          echo "=== 渚濊禆灏辩华 ==="

      - name: 缁勮缂栬瘧鍙傛暟骞跺惎鍔ㄦ瀯寤?        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
          KSU_MODE: ${{ inputs.ksu_mode }}
          KPM: ${{ inputs.kpm }}
          DEBUG_KSU: ${{ inputs.debug_ksu }}
          SUSFS: ${{ inputs.susfs }}
          JOBS: ${{ inputs.jobs }}
          CLEAN: ${{ inputs.clean }}
          CUSTOM_REPO: ${{ inputs.custom_repo }}
          CUSTOM_BRANCH: ${{ inputs.custom_branch }}
          CUSTOM_DEFCONFIG: ${{ inputs.custom_defconfig }}
          CUSTOM_KVER: ${{ inputs.custom_kver }}
          CUSTOM_ANDROID: ${{ inputs.custom_android }}
          CUSTOM_GKI: ${{ inputs.custom_gki }}
          DRY_RUN: ${{ inputs.dry_run }}
          # ccache: 澶嶇敤缂栬瘧浜х墿缂撳瓨, 鍚屼竴璁惧/鐗堟湰閲嶅缂栬瘧鍙ぇ骞呮彁閫?          KERNEL_CCACHE: '1'
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$CUSTOM_REPO" ]; then
            ARGS+=(--repo "$CUSTOM_REPO" --branch "$CUSTOM_BRANCH")
            [ -n "$CUSTOM_DEFCONFIG" ] && ARGS+=(--defconfig "$CUSTOM_DEFCONFIG")
            [ -n "$CUSTOM_KVER" ] && ARGS+=(--kver "$CUSTOM_KVER")
            [ -n "$CUSTOM_ANDROID" ] && ARGS+=(--android "$CUSTOM_ANDROID")
            [ "$CUSTOM_GKI" = "true" ] && ARGS+=(--gki)
          else
            ARGS+=(--device "$DEVICE" --version "${VERSION:-1}")
          fi
          [ -n "$KSU_BRANCH" ] && ARGS+=(--ksu "$KSU_BRANCH")
          [ -n "$KSU_MODE" ] && ARGS+=(--ksu-mode "$KSU_MODE")
          [ "$KPM" = "true" ] && ARGS+=(--kpm)
          [ "$DEBUG_KSU" = "true" ] && ARGS+=(--debug-ksu)
          [ "$SUSFS" = "true" ] && ARGS+=(--susfs)
          [ -n "$JOBS" ] && ARGS+=(--jobs "$JOBS")
          [ "$CLEAN" = "true" ] && ARGS+=(--clean)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          ARGS+=(--yes)
          echo ">>> 鎵ц: bash build.sh ${ARGS[*]}"
          bash build.sh "${ARGS[@]}"

      - name: 浜х墿娓呭崟
        run: |
          echo "=== output/ 鐩綍 ==="
          ls -lh output/ || echo "(鏃犱骇鐗? 鍙兘涓?dry-run 鎴栫紪璇戝け璐?"
          echo "=== 瀹屾垚 ==="

      - name: ccache 鍛戒腑缁熻
        if: always()
        run: |
          ccache --show-stats || echo "(ccache 涓嶅彲鐢?"
          echo "缂撳瓨鐩綍: $(du -sh /home/runner/.ccache 2>/dev/null | cut -f1 || echo 0)"

      - name: 涓婁紶璋冭瘯鏃ュ織(澶辫触鏃舵帓鏌ョ敤)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ inputs.device }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 璇诲彇浜х墿鍚嶇О
        id: art
        if: always()
        run: |
          if [ -f output/LAST_ARTIFACT ]; then
            b="$(basename "$(cat output/LAST_ARTIFACT)")"
            echo "name=${b%.*}" >> "$GITHUB_OUTPUT"
            echo "file=$(cat output/LAST_ARTIFACT)" >> "$GITHUB_OUTPUT"
          else
            echo "name=kernel-${{ inputs.device }}" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: 涓婁紶浜х墿
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: 鑷姩鍙戝竷 GitHub Release(闄勫娉ㄤ笌璇存槑)
        if: success() && !inputs.dry_run && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          art="${{ steps.art.outputs.file }}"
          if [ -z "$art" ] || [ ! -f "$art" ]; then echo "鏃犱骇鐗╂枃浠? 璺宠繃鍙戝竷"; exit 0; fi
          base="$(basename "${art%.*}")"
          tag="build-${base}"
          echo ">>> 鍙戝竷 $base (tag: $tag)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$art" --clobber
          else
            gh release create "$tag" "$art" \
              --title "$base" \
              --notes-file output/release-notes.md
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | "  - \(.name) (\(.size) bytes)")'
