name: SukiSU Kernel Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备 ID(如 alioth、op8、gki-a15;自定义源时填 custom)'
        required: true
        default: ''
      version:
        description: '版本序号(该设备的第几个版本, 从 1 开始)'
        required: false
        default: '1'
      ksu_branch:
        description: 'SukiSU 集成分支(留空=自动: GKI 用 main, 传统内核用 builtin)'
        required: false
        type: choice
        options: ['', main, builtin]
        default: ''
      ksu_mode:
        description: 'CONFIG_KSU 模式: 留空=自动(GKI 用 m, 非 GKI 用 y)'
        required: false
        type: choice
        options: ['', 'y', 'm']
        default: ''
      kpm:
        description: '启用 KPM(内核补丁模块)'
        required: false
        type: boolean
        default: false
      debug_ksu:
        description: '启用 KSU_DEBUG'
        required: false
        type: boolean
        default: false
      susfs:
        description: '启用 SUSFS(要求内核已集成 susfs4ksu 补丁, 否则编译失败)'
        required: false
        type: boolean
        default: false
      jobs:
        description: '并行编译数(留空=自动, 公共 runner 只有 2 核, 建议留空)'
        required: false
        default: ''
      clean:
        description: '编译前清空 work/ 目录(每次全新构建; 公共 runner 本身不保留旧数据, 一般无需勾选)'
        required: false
        type: boolean
        default: false
      custom_repo:
        description: '[自定义源] 内核仓库 URL'
        required: false
        default: ''
      custom_branch:
        description: '[自定义源] 仓库分支'
        required: false
        default: ''
      custom_defconfig:
        description: '[自定义源] defconfig(留空=自动探测)'
        required: false
        default: ''
      custom_kver:
        description: '[自定义源] 内核主版本提示, 如 5.15(用于选编译器)'
        required: false
        default: ''
      custom_android:
        description: '[自定义源] Android 版本号, 如 13(用于选 Clang)'
        required: false
        default: ''
      custom_gki:
        description: '[自定义源] 是否为 GKI 内核'
        required: false
        type: boolean
        default: false
      dry_run:
        description: '演练模式: 只打印任务不编译(调试用)'
        required: false
        type: boolean
        default: false
  # 可被其它工作流(如 build-all.yml 全量矩阵)复用调用
  workflow_call:
    inputs:
      device:
        required: true
        type: string
        default: ''
      version:
        required: false
        type: string
        default: '1'
      ksu_branch:
        required: false
        type: string
        default: ''
      ksu_mode:
        required: false
        type: string
        default: ''
      kpm:
        required: false
        type: boolean
        default: false
      debug_ksu:
        required: false
        type: boolean
        default: false
      susfs:
        required: false
        type: boolean
        default: false
      jobs:
        required: false
        type: string
        default: ''
      clean:
        required: false
        type: boolean
        default: false
      custom_repo:
        required: false
        type: string
        default: ''
      custom_branch:
        required: false
        type: string
        default: ''
      custom_defconfig:
        required: false
        type: string
        default: ''
      custom_kver:
        required: false
        type: string
        default: ''
      custom_android:
        required: false
        type: string
        default: ''
      custom_gki:
        required: false
        type: boolean
        default: false
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 恢复编译工具链缓存(Clang/GCC, 命中可省去重新下载解压)
        uses: actions/cache@v4
        with:
          path: work/toolchains
          key: toolchains-${{ inputs.device }}-${{ inputs.version }}-${{ inputs.custom_kver }}-${{ inputs.custom_android }}-v1
          restore-keys: |
            toolchains-${{ inputs.device }}-
            toolchains-

      - name: 恢复 ccache 编译缓存(重复编译同一设备/版本可大幅提速)
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.device }}-${{ inputs.version }}-${{ inputs.ksu_branch }}-${{ inputs.custom_repo }}-v1
          restore-keys: |
            ccache-${{ inputs.device }}-
            ccache-

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl make gcc g++ bc bison flex python3 zip cpio ccache \
            libssl-dev xz-utils lz4 zstd dwarves || true
          # 老内核 GCC 4.9 预编译可能需要 libtinfo5(新版本 Ubuntu 已移除, 装不上就忽略)
          sudo apt-get install -y --no-install-recommends libtinfo5 || true
          sudo apt-get install -y --no-install-recommends libncurses-dev || true
          echo "=== 依赖就绪 ==="

      - name: 组装编译参数并启动构建
        env:
          DEVICE: ${{ inputs.device }}
          VERSION: ${{ inputs.version }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
          KSU_MODE: ${{ inputs.ksu_mode }}
          KPM: ${{ inputs.kpm }}
          DEBUG_KSU: ${{ inputs.debug_ksu }}
          SUSFS: ${{ inputs.susfs }}
          JOBS: ${{ inputs.jobs }}
          CLEAN: ${{ inputs.clean }}
          CUSTOM_REPO: ${{ inputs.custom_repo }}
          CUSTOM_BRANCH: ${{ inputs.custom_branch }}
          CUSTOM_DEFCONFIG: ${{ inputs.custom_defconfig }}
          CUSTOM_KVER: ${{ inputs.custom_kver }}
          CUSTOM_ANDROID: ${{ inputs.custom_android }}
          CUSTOM_GKI: ${{ inputs.custom_gki }}
          DRY_RUN: ${{ inputs.dry_run }}
          # ccache: 复用编译产物缓存, 同一设备/版本重复编译可大幅提速
          KERNEL_CCACHE: '1'
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$CUSTOM_REPO" ]; then
            ARGS+=(--repo "$CUSTOM_REPO" --branch "$CUSTOM_BRANCH")
            [ -n "$CUSTOM_DEFCONFIG" ] && ARGS+=(--defconfig "$CUSTOM_DEFCONFIG")
            [ -n "$CUSTOM_KVER" ] && ARGS+=(--kver "$CUSTOM_KVER")
            [ -n "$CUSTOM_ANDROID" ] && ARGS+=(--android "$CUSTOM_ANDROID")
            [ "$CUSTOM_GKI" = "true" ] && ARGS+=(--gki)
          else
            ARGS+=(--device "$DEVICE" --version "${VERSION:-1}")
          fi
          [ -n "$KSU_BRANCH" ] && ARGS+=(--ksu "$KSU_BRANCH")
          [ -n "$KSU_MODE" ] && ARGS+=(--ksu-mode "$KSU_MODE")
          [ "$KPM" = "true" ] && ARGS+=(--kpm)
          [ "$DEBUG_KSU" = "true" ] && ARGS+=(--debug-ksu)
          [ "$SUSFS" = "true" ] && ARGS+=(--susfs)
          [ -n "$JOBS" ] && ARGS+=(--jobs "$JOBS")
          [ "$CLEAN" = "true" ] && ARGS+=(--clean)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          ARGS+=(--yes)
          echo ">>> 执行: bash build.sh ${ARGS[*]}"
          bash build.sh "${ARGS[@]}"

      - name: 产物清单
        run: |
          echo "=== output/ 目录 ==="
          ls -lh output/ || echo "(无产物, 可能为 dry-run 或编译失败)"
          echo "=== 完成 ==="

      - name: ccache 命中统计
        if: always()
        run: |
          ccache --show-stats || echo "(ccache 不可用)"
          echo "缓存目录: $(du -sh /home/runner/.ccache 2>/dev/null | cut -f1 || echo 0)"

      - name: 上传调试日志(失败时排查用)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log-${{ inputs.device }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 上传产物
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.device }}-${{ inputs.ksu_branch || 'auto' }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
