name: SukiSU 全量编译(矩阵)

# 一键对 devices.json 里的每个"机型 + 内核版本"组合并行编译。
# - 由 tools/trigger-all.sh 触发, 也可以在本仓库 Actions 页面手动 Run workflow。
# - 每个组合复用 build.yml(单设备编译工作流), 产物名即产品名(品牌_机型_代码_内核版本_SukiSU-版本_日期时间)。
# - 公共仓库的 Actions 分钟数免费, 但 177+ 个组合排队需要数小时, 请按需使用
#   max_parallel(默认 2)控制并发, 避免 runner 上内存/CPU 争抢导致超时。

on:
  workflow_dispatch:
    inputs:
      only:
        description: '只编译指定设备 ID(逗号分隔, 如 alioth,marble;留空=全部)'
        required: false
        default: ''
      max_parallel:
        description: '最大并行任务数(默认 2; public 仓库免费分钟数不限, 控制并发防超时)'
        required: false
        default: '2'
      dry_run:
        description: '演练模式(只跑参数检查与日志, 不真正编译)'
        required: false
        type: boolean
        default: true
      publish:
        description: '编译成功后自动发布到 GitHub Release(全量会生成较多 Release, 默认关闭)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: 生成编译矩阵
    # 固定 runner，避免矩阵中旧内核因镜像漂移产生不可复现失败。
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 由 devices.json 生成矩阵
        id: matrix
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > matrix.json
          import json, os
          only = (os.environ.get('ONLY') or '').strip()
          allowed = {x.strip() for x in only.split(',') if x.strip()} if only else None
          raw = open('devices.json', 'rb').read()
          if raw[:2] == b'\xff\xfe':
              text = raw.decode('utf-16-le').lstrip('\ufeff')
          elif raw[:3] == b'\xef\xbb\xbf':
              text = raw.decode('utf-8-sig')
          else:
              text = raw.decode('utf-8')
          data = json.loads(text)
          excluded = set()
          try:
              ex = json.load(open('excluded-combinations.json', encoding='utf-8'))
              excluded = {str(x).strip() for x in ex.get('combinations', []) if str(x).strip()}
          except FileNotFoundError:
              pass
          include = []
          skipped = 0
          for dev in data['devices']:
              if allowed is not None and dev['id'] not in allowed:
                  continue
              for idx, ver in enumerate(dev['versions'], 1):
                  combination = f"{dev['id']}:v{idx}"
                  if combination in excluded:
                      skipped += 1
                      continue
                  if ver.get('unsupported'):
                      skipped += 1
                      continue
                  include.append({
                      'device': dev['id'],
                      'version': str(idx),
                      'label': f"{dev['id']} v{idx} ({ver.get('label','')})",
                  })
          PY
          COUNT=$(python3 -c "import json;print(len(json.load(open('matrix.json'))['include']))")
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo ">>> 将编译 $COUNT 个组合 (已跳过 unsupported 版本)"
          python3 -c "import json;[print('  -', x['label']) for x in json.load(open('matrix.json'))['include']]"

  build:
    name: 编译 ${{ matrix.label }}
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel || '2') }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    with:
      device: ${{ matrix.device }}
      version: ${{ matrix.version }}
      dry_run: ${{ inputs.dry_run }}
      publish: ${{ inputs.publish }}
