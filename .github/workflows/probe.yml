name: probe

# 一次性排查工作流: 只看构建系统行为, 不产出内核
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEVICE_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
      DEVICE_BRANCH: ares-r-oss
      DEVICE_DEFCONFIG: ares_user_defconfig
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends git make bc bison flex libssl-dev
      - name: 克隆内核树并生成配置
        run: |
          set -x
          git clone --depth 1 --single-branch -b "$DEVICE_BRANCH" "$DEVICE_REPO" /tmp/k
          cd /tmp/k
          make O=/tmp/out ARCH=arm64 "$DEVICE_DEFCONFIG" > /tmp/defconfig.log 2>&1 || { tail -30 /tmp/defconfig.log; exit 1; }
          echo "=== .config 平台相关 ==="
          grep -E 'CONFIG_(MTK_PLATFORM|MACH_MT|MTK_PWM|MTK_VIBRATOR|ARCH_MTK_PROJECT|CC_IS_CLANG|CC_IS_GCC|CROSS_COMPILE)' /tmp/out/.config | head -30
      - name: 看 pwm/vibrator 目录与 Makefile
        run: |
          cd /tmp/k
          echo "=== ls pwm ==="; ls drivers/misc/mediatek/pwm
          echo "=== ls pwm/mt6885 ==="; ls drivers/misc/mediatek/pwm/mt6885
          echo "=== pwm/Makefile ==="; cat drivers/misc/mediatek/pwm/Makefile
          echo "=== pwm/mt6885/Makefile ==="; cat drivers/misc/mediatek/pwm/mt6885/Makefile
          echo "=== vibrator/Makefile 前 25 行 ==="; head -25 drivers/misc/mediatek/vibrator/Makefile
          echo "=== ls vibrator ==="; ls drivers/misc/mediatek/vibrator
      - name: make -n 看会编译什么
        run: |
          cd /tmp/k
          make O=/tmp/out ARCH=arm64 -n drivers/misc/mediatek/pwm/ > /tmp/pwm-n.log 2>&1 || true
          echo "=== pwm -n 里与 mt/CC 相关的行 ==="
          grep -nE 'mt6885|mt6765|mtk_pwm|CC ' /tmp/pwm-n.log | head -40
          echo "=== pwm -n 总行数 ==="; wc -l /tmp/pwm-n.log
          echo "=== pwm -n 前 30 行 ==="; head -30 /tmp/pwm-n.log
          make O=/tmp/out ARCH=arm64 -n drivers/misc/mediatek/vibrator/ > /tmp/vib-n.log 2>&1 || true
          echo "=== vibrator -n 相关行 ==="
          grep -nE 'mt6885|mt6765|vibr|CC ' /tmp/vib-n.log | head -30
      - name: 诊断 obj-y 展开(强制触发 kbuild 打印)
        run: |
          cd /tmp/k
          # 直接问 kbuild 该目录的 obj-y 值: 借助 Makefile.build 的 $(info) 不便, 改用 -p 抓变量
          make O=/tmp/out ARCH=arm64 -p drivers/misc/mediatek/pwm/ 2>/dev/null > /tmp/pwm-p.log || true
          echo "=== -p 输出中 obj-y 赋值(含 mt) ==="
          grep -nE '^(obj-y|obj-\[m\]|obj-\[y\]) .*mt6' /tmp/pwm-p.log | head -20
          grep -nE '^CONFIG_MTK_PLATFORM' /tmp/pwm-p.log | head -5
          echo "=== 结束 ==="
