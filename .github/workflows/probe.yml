name: probe v5
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev >/dev/null
          git clone -q --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 /tmp/gcc49
          git clone -q --depth 1 -b olive-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource /tmp/k
          chmod +x /tmp/gcc49/bin/*
      - name: probe
        run: |
          set +e
          export CC=/tmp/gcc49/bin/aarch64-linux-android-gcc
          export CROSS_COMPILE=/tmp/gcc49/bin/aarch64-linux-android-
          cd /tmp/k
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE olive-perf_defconfig >/dev/null 2>&1
          n=0
          while IFS= read -r f; do
            case "$f" in ./Makefile|Makefile|./Kbuild|Kbuild) continue ;; esac
            sed -i -E 's/-Werror=/-Wno-error=/g; s/(^|[^A-Za-z0-9_-])-Werror([[:space:]]|$)/\1-Wno-error\2/g' "$f"
            n=$((n+1))
          done < <(find . \( -name '.git' -o -name 'scripts' -o -name 'tools' \) -prune -o \( -name 'Makefile' -o -name 'Kbuild' -o -name '*.mk' \) -exec grep -l -- '-Werror' {} + 2>/dev/null)
          echo "demoted: $n"
          printf '\nKBUILD_CFLAGS += -Wno-error\n' >> Makefile
          rm -rf /tmp/o
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE olive-perf_defconfig >/dev/null 2>&1; echo "defconfig rc=$?"
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE KCFLAGS="-fno-builtin-sprintf -fno-builtin-stpcpy -fno-builtin-memcmp -fno-builtin-bcmp" prepare >/tmp/e.log 2>&1; echo "prepare rc=$?"
          tail -4 /tmp/e.log
