name: Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 探测 llvm 分支内版本目录
        run: |
          set -x
          jnames() { python3 -c '
import json,sys
t=sys.stdin.read()
if t.startswith(")]}'"'"'"): t=t[t.index("\n")+1:]
d=json.loads(t)
print(" ".join(e["name"] for e in d.get("entries",[])))'; }
          for b in llvm-r353983 llvm-r365631 llvm-r416183 llvm-r450784 llvm-r487747 llvm-r510928 llvm-r522817; do
            echo "=== $b 条目 ==="
            curl -s "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+show/$b/?format=JSON" | jnames
          done
          echo "=== tarball 探测 (只取 1 字节看状态) ==="
          for pair in "llvm-r416183/clang-r416183b" "llvm-r450784/clang-r450784d" "llvm-r487747/clang-r487747c" "llvm-r510928/clang-r510928" "llvm-r522817/clang-r522817" "llvm-r353983/clang-r353983c" "llvm-r365631/clang-r365631c"; do
            b="${pair%%/*}"; d="${pair##*/}"
            printf "%s/%s -> " "$b" "$d"
            curl -sL -r 0-0 -o /dev/null -w 'status=%{http_code}\n' "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$b/$d.tar.gz" || echo "curl 失败"
          done
          echo "=== gcc64 4.9 main 条目 ==="
          curl -s "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+show/main/?format=JSON" | jnames
          echo "=== gcc64 4.9 bin 目录条目(前几个) ==="
          curl -s "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+show/main/bin/?format=JSON" | jnames | cut -c1-200
