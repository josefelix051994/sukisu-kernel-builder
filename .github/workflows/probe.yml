name: probe compiler
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache >/dev/null
          git clone -q --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 /tmp/gcc49
          chmod +x /tmp/gcc49/bin/aarch64-linux-android-gcc || true
      - name: probe
        run: |
          GCC=/tmp/gcc49/bin/aarch64-linux-android-gcc
          echo "=== version ==="; $GCC --version | head -1
          echo "=== plain -fstack-protector-strong -E /dev/null ==="; $GCC -fstack-protector-strong -E -x c /dev/null -o /dev/null; echo "rc=$?"
          echo "=== cc-option style (-Werror -c -x c /dev/null) ==="; TMP=/tmp/xx.$$.o; $GCC -fstack-protector-strong -Werror -c -x c /dev/null -o $TMP; echo "rc=$?"; ls -l $TMP 2>/dev/null
          echo "=== with ccache wrapper ==="; PATH=/usr/lib/ccache:$PATH; ccache --version | head -1; ccache $GCC -fstack-protector-strong -Werror -c -x c /dev/null -o /tmp/yy.$$.o; echo "rc=$?"
          echo "=== gcc with -fno-builtin-bcmp ==="; $GCC -fno-builtin-bcmp -c -x c /dev/null -o /tmp/zz.$$.o; echo "rc=$?"
          echo "=== gcc with -fno-builtin-stpcpy/date-time warn test ==="; $GCC -Wno-error=date-time -Werror -c -x c /dev/null -o /tmp/ww.$$.o; echo "rc=$?"
