name: probe v4
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: setup
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev >/dev/null
          git clone -q --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 /tmp/gcc49
          git clone -q --depth 1 -b olive-q-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource /tmp/k
          chmod +x /tmp/gcc49/bin/* 
      - name: probe
        run: |
          set +e
          export CC=/tmp/gcc49/bin/aarch64-linux-android-gcc
          export CROSS_COMPILE=/tmp/gcc49/bin/aarch64-linux-android-
          cd /tmp/k
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE olive-perf_defconfig >/dev/null 2>&1; echo "defconfig rc=$?"
          echo "=== D: broad demotion ==="
          n=0
          for f in $(grep -rlE -- '-Werror' --include=Makefile --include=Kbuild --include='*.mk' . 2>/dev/null | grep -v '^\./scripts' | grep -v '^\./tools'); do
            sed -i -E 's/(^|[^A-Za-z0-9_-])-Werror(=[A-Za-z0-9_=,-]+)?/\1-Wno-error\2/g' "$f"
            n=$((n+1))
          done
          echo "demoted files: $n"
          rm -rf /tmp/o
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE olive-perf_defconfig >/dev/null 2>&1; echo "defconfig2 rc=$?"
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE prepare >/tmp/d.log 2>&1; echo "prepare rc=$?"
          tail -6 /tmp/d.log
          echo "=== KBUILD_CFLAGS tail ==="
          make O=/tmp/o ARCH=arm64 CC=$CC CROSS_COMPILE=$CROSS_COMPILE -pn 2>/dev/null | grep -m1 '^KBUILD_CFLAGS' | tail -c 700
